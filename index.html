<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <style>
        :root {
            --bg-primary: #0f111a;
            --bg-secondary: #1a1d2e;
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e3456;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar / Dashboard Module */
        .dashboard {
            width: 320px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .dash-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dash-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .game-btn {
            width: 100%;
            padding: 12px 15px;
            background: #252942;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-btn:hover {
            background: var(--accent);
            border-color: var(--accent-hover);
        }

        .game-btn.active {
            background: var(--accent);
            border-color: var(--accent-hover);
            box-shadow: 0 0 12px rgba(79, 70, 229, 0.4);
        }

        /* Dev Master Controls */
        .dev-panel {
            padding: 15px;
            border-top: 1px solid var(--border);
            background: #141624;
        }

        .dev-input {
            width: 100%;
            padding: 10px;
            background: #0f111a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .dev-btn {
            width: 100%;
            padding: 10px;
            background: #10b981;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dev-btn:hover {
            background: #059669;
        }

        /* Main Workspace Runtime Viewport */
        .runtime-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-primary);
            position: relative;
        }

        .runtime-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            display: none;
        }

        .no-session {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            max-width: 400px;
            padding: 20px;
        }

        .no-session h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .no-session p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Dashboard Sidebar -->
    <div class="dashboard">
        <div class="dash-header">
            <h1>🎮 Game Hub</h1>
            <span style="color: var(--text-muted); font-size: 0.85rem;">Arcade Deck</span>
        </div>

        <!-- Populated Game Catalog -->
        <div class="game-list" id="gameList">
            <!-- Core titles auto-injected here -->
        </div>

        <!-- Dev Mode Authentication & Verification Section -->
        <div class="dev-panel">
            <h4 style="font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted);">➕ Dev Game Injector</h4>
            <input type="password" id="devPass" class="dev-input" placeholder="Developer Password">
            <div id="devFields" style="display: none;">
                <input type="text" id="gameTitle" class="dev-input" placeholder="Game Title">
                <input type="text" id="gameUrl" class="dev-input" placeholder="Game URL / Iframe Link">
                <button class="dev-btn" onclick="saveCustomGame()">Compile Game Array</button>
            </div>
            <button id="unlockBtn" class="dev-btn" style="background: var(--accent);" onclick="verifyDevAccess()">Verify Access</button>
        </div>
    </div>

    <!-- Main Live Workspace Runtime Engine -->
    <div class="runtime-container">
        <iframe id="gameCanvas" class="runtime-frame" allowfullscreen src=""></iframe>
        
        <div class="no-session" id="fallbackScreen">
            <h3>No Active Game Session</h3>
            <p>Select a title from your collapsible dashboard module to launch its runtime loop.</p>
        </div>
    </div>

    <script>
        // Core Curated Game Definition Library
        const baseGames = [
            {
                id: 'slope',
                title: 'Slope',
                url: 'https://kbhgames.com/game/slope/embed'
            },
            {
                id: 'getaway-shootout',
                title: 'Getaway Shootout',
                url: 'https://ubg77.github.io/edit/getaway-shootout/'
            },
            {
                id: 'basket-random',
                title: 'Basket Random',
                url: 'https://only-game.github.io/projects/basket-random/index.html'
            },
            {
                id: 'volley-random',
                title: 'Volley Random',
                url: 'https://twoplayergames.github.io/volley-random/'
            },
            {
                id: 'soccer-random',
                title: 'Soccer Random',
                url: 'https://only-game.github.io/projects/soccer-random/index.html'
            },
            {
                id: 'boxing-random',
                title: 'Boxing Random',
                url: 'https://twoplayergames.github.io/boxing-random/'
            },
            {
                id: 'bitlife',
                title: 'BitLife',
                url: 'https://ubg77.github.io/edit/bitlife/'
            }
        ];

        // Developer Key Constant Config
        const DEV_PASSWORD = "071812"; 

        // Primary application init state engine
        function initApp() {
            renderGameLibrary();
        }

        // Render system loop mapping definitions into buttons
        function renderGameLibrary() {
            const listContainer = document.getElementById('gameList');
            listContainer.innerHTML = '';

            // Retrieve dynamically stored custom records from localStorage
            const savedCustomGames = JSON.parse(localStorage.getItem('gamehub_custom_deck')) || [];
            const completeManifest = [...baseGames, ...savedCustomGames];

            completeManifest.forEach(game => {
                const btn = document.createElement('button');
                btn.className = 'game-btn';
                btn.innerHTML = `🕹️ <span>${game.title}</span>`;
                btn.onclick = () => launchRuntimeLoop(game.url, btn);
                listContainer.appendChild(btn);
            });
        }

        // Handles loading URLs into the primary iframe instance securely
        function launchRuntimeLoop(targetUrl, actionButton) {
            const iframe = document.getElementById('gameCanvas');
            const fallback = document.getElementById('fallbackScreen');

            // Reset active styles
            document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
            actionButton.classList.add('active');

            // Trigger workspace canvas loading
            fallback.style.display = 'none';
            iframe.style.display = 'block';
            iframe.src = targetUrl;
        }

        // Middleware password protection gate logic
        function verifyDevAccess() {
            const passInput = document.getElementById('devPass').value;
            if (passInput === DEV_PASSWORD) {
                document.getElementById('devFields').style.display = 'block';
                document.getElementById('devPass').style.display = 'none';
                document.getElementById('unlockBtn').style.display = 'none';
            } else {
                alert("Runtime Execution Refused: Invalid Credentials.");
            }
        }

        // Saves custom user arrays to persistent browser cache indefinitely
        function saveCustomGame() {
            const title = document.getElementById('gameTitle').value.trim();
            const url = document.getElementById('gameUrl').value.trim();

            if (!title || !url) {
                alert("Fields cannot be left blank.");
                return;
            }

            const uniqueId = 'custom-' + Date.now();
            const newGameObject = { id: uniqueId, title: title, url: url };

            // Fetch list out of local storage loop block
            const existingDeck = JSON.parse(localStorage.getItem('gamehub_custom_deck')) || [];
            existingDeck.push(newGameObject);
            
            // Rewrite entry payload safely inside memory structures
            localStorage.setItem('gamehub_custom_deck', JSON.stringify(existingDeck));

            // Refresh UI interface elements safely
            renderGameLibrary();

            // Clear configuration data workspace fields
            document.getElementById('gameTitle').value = '';
            document.getElementById('gameUrl').value = '';
            alert(`"${title}" compiled and written to your Master File deck permanently!`);
        }

        // Fire initialization engine loop on lifecycle start
        window.onload = initApp;
    </script>
</body>
</html>
